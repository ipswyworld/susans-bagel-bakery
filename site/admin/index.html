<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bakery admin | Susan's Bagel Bakery</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Rokkitt:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { padding-bottom: 3rem; }
  .wrap { max-width: 62rem; margin: 0 auto; padding: 1.25rem var(--gutter) 3rem; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .bar h1 { font-size: 2.4rem; }
  .tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .tabs button[aria-selected=true] { background: var(--ink); color: var(--yellow); }
  .tabs button { font: 700 1rem/1 var(--body); padding: .8rem 1.3rem; border-radius: 999px; border: 2.5px solid var(--ink); background: transparent; cursor: pointer; min-height: 2.9rem; }
  .panel { background: var(--butter); border-radius: 1.5rem; padding: clamp(1rem, 3vw, 1.75rem); box-shadow: 0 8px 0 var(--yellow-deep); }
  .login { max-width: 26rem; margin: 12vh auto; }
  .login h1 { font-size: 2.6rem; margin-bottom: 1rem; }
  .item { display: grid; gap: .6rem; grid-template-columns: 1fr; padding: 1rem 0; border-bottom: 2px dotted var(--brown); }
  .item:last-child { border: 0; }
  .item .cols { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); }
  .item label { font-weight: 700; font-size: .9rem; display: block; margin-bottom: .2rem; }
  .item .acts { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .item .btn { min-height: 2.6rem; padding: .6rem 1.1rem; box-shadow: none; }
  .chk { display: inline-flex; gap: .5rem; align-items: center; font-weight: 700; min-height: 2.6rem; }
  .chk input { width: 1.4rem; height: 1.4rem; accent-color: var(--brown); }
  .rev { padding: 1rem 0; border-bottom: 2px dotted var(--brown); }
  .rev .meta { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; margin-bottom: .4rem; font-weight: 700; }
  .tag { font-size: .8rem; padding: .2rem .6rem; border-radius: 99px; border: 2px solid var(--ink); }
  .tag.pending { background: var(--yellow); } .tag.approved { background: var(--brown); color: #fff; } .tag.rejected { background: transparent; color: var(--danger); border-color: var(--danger); }
  .toast { position: fixed; left: 50%; bottom: 1.25rem; translate: -50% 0; background: var(--ink); color: var(--yellow); padding: .8rem 1.4rem; border-radius: 99px; font-weight: 700; z-index: 60; }
  .pw { position: relative; }
  .pw input { padding-right: 3.4rem !important; }
  .pw-eye { position: absolute; right: .3rem; top: 50%; translate: 0 -50%; width: 2.75rem; height: 2.75rem; border: 0; background: transparent; color: var(--ink); border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
  .pw-eye:hover { background: var(--yellow); }
  .pw-eye .off { display: none; } .pw-eye[aria-pressed=true] .on { display: none; } .pw-eye[aria-pressed=true] .off { display: block; }
  .pw-card { margin-top: 2rem; padding-top: 1.5rem; border-top: 2px solid var(--ink); max-width: 26rem; }
  .qp { display: grid; grid-template-columns: 1fr 7.5rem; gap: .4rem .9rem; align-items: center; padding: .7rem 0; border-bottom: 2px dotted var(--brown); }
  .qp .nm { font-weight: 700; }
  .qp .price-in { display: flex; align-items: center; gap: .4rem; }
  .qp .price-in span { font-weight: 700; }
  .qp input[type=number] { min-height: 2.75rem; padding: .5rem .7rem; text-align: right; }
  .qp .chk { grid-column: 1 / -1; min-height: 2rem; font-weight: 600; }
  .qp.changed { background: oklch(0.9 0.1 85); margin-inline: -.6rem; padding-inline: .6rem; border-radius: 10px; }
  .qp-bar { position: sticky; bottom: .75rem; display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
  @media (min-width: 40rem) { .qp { grid-template-columns: 1fr 8rem auto; } .qp .chk { grid-column: auto; } }
  details.more { margin-top: 2rem; border-top: 2px solid var(--ink); padding-top: 1rem; }
  details.more > summary { cursor: pointer; font: 800 1.5rem/1.2 var(--display); min-height: 2.75rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="login" class="login panel" hidden>
  <h1>Bakery admin</h1>
  <form id="login-form">
    <div class="field"><label for="pw">Password</label><div class="pw"><input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required><button class="pw-eye" type="button" aria-pressed="false" aria-label="Show password"><svg class="on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg><svg class="off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.4 6.5A17 17 0 0 0 2 12s3.600 7 10 7a9.700 9.700 0 0 0 4.100-.9M9.900 9.900a3 3 0 0 0 4.200 4.200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
    <p class="form-msg" id="login-msg" role="status" aria-live="polite"></p>
    <button class="btn btn-primary btn-wide" id="login-btn" type="submit">Sign in</button>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <div class="bar"><h1>Bakery admin</h1><div><a class="btn btn-ghost" href="../" target="_blank">View site</a> <button class="btn btn-ghost" id="logout" type="button">Sign out</button></div></div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="menu">Menu</button>
    <button role="tab" aria-selected="false" data-tab="reviews">Reviews <span id="pending-n"></span></button>
    <button role="tab" aria-selected="false" data-tab="settings">Site info</button>
  </div>
  <section class="panel" id="tab-menu"></section>
  <section class="panel" id="tab-reviews" hidden></section>
  <section class="panel" id="tab-settings" hidden></section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="../js/config.js"></script>
<script>
(() => {
  const API = (window.BAGEL_CONFIG.API_URL || "").replace(/\/$/, "");
  const $ = (s, e = document) => e.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let token = sessionStorage.getItem("bagel-admin") || "";
  const ARTS = ["plain", "wholewheat", "salt", "sesame", "poppy", "everything", "cinnamon", "wwcinnamon", "cheese", "jalapeno", "chocolate", "tomato", "gingerbread", "tub", "box", "drink"];
  const CATS = ["bagel", "spread", "box", "drink"];
  const SETTING_LABELS = {
    whatsapp: ["WhatsApp number (digits only, with country code, e.g. 2547...)", "input"],
    instagram: ["Instagram handle (no @)", "input"],
    email: ["Contact email", "input"], address: ["Address", "input"], hours: ["Opening hours", "input"],
    delivery_info: ["Delivery details", "textarea"], lead_time: ["How much notice you need", "input"],
    min_order_kes: ["Minimum order in KES (0 for none)", "input"], google_review_url: ["Google review link (optional)", "input"],
  };

  const EYE = `<button class="pw-eye" type="button" aria-pressed="false" aria-label="Show password"><svg class="on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg><svg class="off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.4 6.5A17 17 0 0 0 2 12s3.600 7 10 7a9.700 9.700 0 0 0 4.100-.9M9.900 9.900a3 3 0 0 0 4.200 4.200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".pw-eye"); if (!b) return;
    const input = b.parentElement.querySelector("input"), show = input.type === "password";
    input.type = show ? "text" : "password";
    b.setAttribute("aria-pressed", show); b.setAttribute("aria-label", show ? "Hide password" : "Show password");
    input.focus();
  });
  function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2600); }
  async function api(path, opts = {}) {
    const r = await fetch(API + path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, ...(opts.headers || {}) } });
    if (r.status === 401 && path !== "/api/admin/login") { signOut(); throw new Error("Signed out"); }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "Something went wrong");
    return r.status === 204 ? null : r.json();
  }
  function signOut() { token = ""; sessionStorage.removeItem("bagel-admin"); show(); }
  function show() { $("#login").hidden = !!token; $("#app").hidden = !token; if (token) loadAll(); }

  $("#login-form").addEventListener("submit", async (e) => {
    e.preventDefault(); const m = $("#login-msg"), btn = $("#login-btn"); m.className = "form-msg";
    btn.disabled = true; btn.textContent = "Signing in...";
    m.textContent = "Checking your password. If the site has been idle this can take up to a minute.";
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 90000);
    try {
      const r = await api("/api/admin/login", { method: "POST", signal: ctl.signal, body: JSON.stringify({ password: $("#pw").value.trim() }) });
      token = r.token; sessionStorage.setItem("bagel-admin", token); $("#pw").value = ""; m.textContent = ""; show();
    } catch (err) {
      m.className = "form-msg err";
      m.textContent = err.name === "AbortError" || err.message === "Failed to fetch" ? "The server did not answer. Wait a minute and try again." : err.message === "Wrong password" ? "That password is not right. Tap the eye icon to check what you typed." : err.message;
    } finally { clearTimeout(timer); btn.disabled = false; btn.textContent = "Sign in"; }
  });
  $("#logout").addEventListener("click", signOut);
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-selected", x === b));
    ["menu", "reviews", "settings"].forEach((t) => ($("#tab-" + t).hidden = t !== b.dataset.tab));
  }));

  /* menu */
  const itemRow = (m) => `
    <div class="item" data-id="${m.id ?? ""}">
      <div class="cols">
        <div style="grid-column: span 2"><label>Name</label><input data-f="name" value="${esc(m.name)}" maxlength="80"></div>
        <div><label>Price (KES)</label><input data-f="price_kes" type="number" min="0" value="${m.price_kes}"></div>
        <div><label>Group</label><select data-f="category">${CATS.map((c) => `<option ${c === m.category ? "selected" : ""}>${c}</option>`).join("")}</select></div>
        <div><label>Picture</label><select data-f="art">${ARTS.map((c) => `<option ${c === m.art ? "selected" : ""}>${c}</option>`).join("")}</select></div>
        <div><label>Order on page</label><input data-f="sort_order" type="number" value="${m.sort_order}"></div>
      </div>
      <div><label>Description</label><input data-f="description" value="${esc(m.description)}" maxlength="240"></div>
      <div class="acts">
        <label class="chk"><input data-f="available" type="checkbox" ${m.available ? "checked" : ""}> Available today</label>
        <button class="btn btn-primary" data-do="save" type="button">${m.id ? "Save" : "Add item"}</button>
        ${m.id ? `<button class="btn btn-ghost" data-do="del" type="button">Delete</button>` : ""}
      </div>
    </div>`;
  let ITEMS = [];
  async function loadMenu() {
    const items = ITEMS = await api("/api/admin/menu");
    $("#tab-menu").innerHTML = `<h2 style="font-size:1.8rem;margin-bottom:.5rem">Menu and prices</h2>
      <p class="fine" style="margin:0 0 .75rem">Change a price or untick "Available today" to mark a bagel sold out, then press Save. Changes show on the website straight away.</p>
      <form id="prices-form">` + items.map((m) => `
        <div class="qp" data-id="${m.id}">
          <span class="nm">${esc(m.name)}</span>
          <div class="price-in"><span>KES</span><input type="number" inputmode="numeric" min="0" step="5" value="${m.price_kes}" data-orig="${m.price_kes}" aria-label="Price of ${esc(m.name)} in KES"></div>
          <label class="chk"><input type="checkbox" ${m.available ? "checked" : ""} data-orig="${m.available ? 1 : 0}"> Available today</label>
        </div>`).join("") + `
        <div class="qp-bar"><button class="btn btn-primary" type="submit" id="qp-save" disabled>Save changes</button><span class="fine" id="qp-count" style="margin:0" role="status"></span></div>
      </form>
      <details class="more"><summary>Add or edit items in detail</summary>`
      + `<h3 style="margin:1rem 0 0">Add a new item</h3>` + itemRow({ name: "", description: "", price_kes: 0, category: "bagel", art: "plain", available: true, sort_order: items.length })
      + `<h3 style="margin:1.5rem 0 0">All items</h3>` + items.map(itemRow).join("") + `</details>`;
    const form = $("#prices-form");
    const changed = () => [...form.querySelectorAll(".qp")].filter((r) => { const [p, c] = r.querySelectorAll("input"); return p.value !== p.dataset.orig || (c.checked ? 1 : 0) !== +c.dataset.orig; });
    const refresh = () => {
      form.querySelectorAll(".qp").forEach((r) => r.classList.remove("changed")); const ch = changed(); ch.forEach((r) => r.classList.add("changed"));
      $("#qp-save").disabled = !ch.length; $("#qp-count").textContent = ch.length ? `${ch.length} item${ch.length === 1 ? "" : "s"} changed` : "";
    };
    form.addEventListener("input", refresh); form.addEventListener("change", refresh);
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); const rows = changed(), btn = $("#qp-save"); btn.disabled = true; btn.textContent = "Saving...";
      try {
        for (const r of rows) {
          const [p, c] = r.querySelectorAll("input"), item = ITEMS.find((m) => String(m.id) === r.dataset.id);
          const price = Number(p.value); if (!Number.isFinite(price) || price < 0 || p.value === "") throw new Error(`Check the price for ${item.name}`);
          await api("/api/admin/menu/" + item.id, { method: "PUT", body: JSON.stringify({ ...item, price_kes: price, available: c.checked }) });
        }
        toast(`Saved ${rows.length} change${rows.length === 1 ? "" : "s"}`); loadMenu();
      } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = "Save changes"; }
    });
  }
  $("#tab-menu").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-do]"); if (!b) return;
    const row = b.closest(".item"), id = row.dataset.id;
    try {
      if (b.dataset.do === "del") { if (!confirm("Delete this item for good?")) return; await api("/api/admin/menu/" + id, { method: "DELETE" }); toast("Deleted"); }
      else {
        const body = {}; row.querySelectorAll("[data-f]").forEach((f) => (body[f.dataset.f] = f.type === "checkbox" ? f.checked : f.type === "number" ? Number(f.value) : f.value));
        if (!body.name.trim()) throw new Error("Give the item a name");
        await api("/api/admin/menu" + (id ? "/" + id : ""), { method: id ? "PUT" : "POST", body: JSON.stringify(body) }); toast(id ? "Saved" : "Added");
      }
      loadMenu();
    } catch (err) { toast(err.message); }
  });

  /* reviews */
  async function loadReviews() {
    const rs = await api("/api/admin/reviews"), p = rs.filter((r) => r.status === "pending").length;
    $("#pending-n").textContent = p ? `(${p} new)` : "";
    $("#tab-reviews").innerHTML = `<h2 style="font-size:1.8rem;margin-bottom:.5rem">Reviews</h2><p class="fine" style="margin:0">Only approved reviews appear on the site.</p>`
      + (rs.length ? rs.map((r) => `<div class="rev" data-id="${r.id}"><div class="meta"><span>${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span><span>${esc(r.name)}</span><span class="tag ${r.status}">${r.status}</span></div><p>${esc(r.comment)}</p>
        <div class="acts" style="display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap">
          ${r.status !== "approved" ? `<button class="btn btn-primary" style="min-height:2.6rem;padding:.6rem 1.1rem;box-shadow:none" data-r="approved" type="button">Approve</button>` : ""}
          ${r.status !== "rejected" ? `<button class="btn btn-ghost" style="min-height:2.6rem;padding:.6rem 1.1rem" data-r="rejected" type="button">Reject</button>` : ""}
          <button class="btn btn-ghost" style="min-height:2.6rem;padding:.6rem 1.1rem" data-r="delete" type="button">Delete</button></div></div>`).join("") : `<p style="margin-top:1rem">No reviews yet.</p>`);
  }
  $("#tab-reviews").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-r]"); if (!b) return; const id = b.closest(".rev").dataset.id;
    try {
      if (b.dataset.r === "delete") { if (!confirm("Delete this review for good?")) return; await api("/api/admin/reviews/" + id, { method: "DELETE" }); }
      else await api("/api/admin/reviews/" + id, { method: "PATCH", body: JSON.stringify({ status: b.dataset.r }) });
      toast("Done"); loadReviews();
    } catch (err) { toast(err.message); }
  });

  /* settings */
  async function loadSettings() {
    const s = await api("/api/admin/settings");
    $("#tab-settings").innerHTML = `<h2 style="font-size:1.8rem;margin-bottom:1rem">Site info</h2><form id="set-form">`
      + Object.entries(SETTING_LABELS).map(([k, [label, kind]]) => `<div class="field"><label for="s-${k}">${label}</label>${kind === "textarea" ? `<textarea id="s-${k}" data-k="${k}" rows="2">${esc(s[k] || "")}</textarea>` : `<input id="s-${k}" data-k="${k}" value="${esc(s[k] || "")}">`}</div>`).join("")
      + `<button class="btn btn-primary" type="submit">Save site info</button></form>`
      + `<form class="pw-card" id="pw-form"><h3 style="font-size:1.6rem;margin-bottom:.75rem">Change password</h3>`
      + [["pw-cur", "Current password", "current-password"], ["pw-new", "New password (8 or more characters)", "new-password"]].map(([id, l, ac]) => `<div class="field"><label for="${id}">${l}</label><div class="pw"><input id="${id}" type="password" autocomplete="${ac}" autocapitalize="none" spellcheck="false" required minlength="${id === "pw-new" ? 8 : 1}">${EYE}</div></div>`).join("")
      + `<button class="btn btn-primary" type="submit">Change password</button></form>`;
    $("#pw-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try { await api("/api/admin/password", { method: "POST", body: JSON.stringify({ current: $("#pw-cur").value, new: $("#pw-new").value }) }); toast("Password changed"); e.target.reset(); }
      catch (err) { toast(err.message); }
    });
    $("#set-form").addEventListener("submit", async (e) => {
      e.preventDefault(); const body = {}; e.target.querySelectorAll("[data-k]").forEach((f) => (body[f.dataset.k] = f.value.trim()));
      body.whatsapp = body.whatsapp.replace(/\D/g, ""); body.instagram = body.instagram.replace(/^@/, "");
      try { await api("/api/admin/settings", { method: "PUT", body: JSON.stringify(body) }); toast("Saved"); loadSettings(); } catch (err) { toast(err.message); }
    });
  }
  const loadAll = () => Promise.all([loadMenu(), loadReviews(), loadSettings()]).catch((e) => toast(e.message));
  show();
})();
</script>
</body>
</html>
